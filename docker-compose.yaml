---
services:
  weaviate:
    command:
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --scheme
      - http
    image: cr.weaviate.io/semitechnologies/weaviate:1.37.0
    ports:
      - 8080:8080
      - 50051:50051
    volumes:
      - ./collections:/var/lib/weaviate
    restart: on-failure:0
    environment:
      CLUSTER_HOSTNAME: 'node1'
      CLUSTER_ADVERTISE_ADDR: '127.0.0.1'
      ENABLE_API_BASED_MODULES: 'true'
      # Enable APIs + Local Multilingual Models
      ENABLE_MODULES: 'reranker-transformers,text2vec-transformers'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-transformers' # Default to local for dev

      # Point to the Local Vietnamese/Multilingual Containers
      TRANSFORMERS_INFERENCE_API: 'http://text2vec-transformers:8080'
      RERANKER_INFERENCE_API: 'http://reranker-transformers:8080'

      # Keys (load from .env file)
      OPENAI_APIKEY: ${OPENAI_API_KEY}
      GOOGLE_APIKEY: ${GEMINI_API_KEY}

      # Optimization
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'

  # RERANKER - CPU (Default)
  reranker-transformers-cpu:
    image: cr.weaviate.io/semitechnologies/reranker-transformers:cross-encoder-ms-marco-MiniLM-L-6-v2
    profiles: ["cpu"]
    environment:
      ENABLE_CUDA: '0'
    ports:
      - 9091:8080
    networks:
      default:
        aliases:
          - reranker-transformers

  # RERANKER - GPU (bge-m3-reranker)
  reranker-transformers-gpu:
    image: cr.weaviate.io/semitechnologies/reranker-transformers:bge-reranker-v2-m3
    profiles: ["gpu"]
    environment:
      ENABLE_CUDA: '1'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - 9091:8080
    networks:
      default:
        aliases:
          - reranker-transformers

  # EMBEDDING: Multimodal - CPU
  text2vec-transformers-cpu:
    image: cr.weaviate.io/semitechnologies/transformers-inference:baai-bge-m3-onnx
    profiles: ["cpu"]
    environment:
      ENABLE_CUDA: '0'
    networks:
      default:
        aliases:
          - text2vec-transformers

  # EMBEDDING: Multimodal - GPU
  text2vec-transformers-gpu:
    image: cr.weaviate.io/semitechnologies/transformers-inference:baai-bge-m3-onnx
    profiles: ["gpu"]
    environment:
      ENABLE_CUDA: '1'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      default:
        aliases:
          - text2vec-transformers

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres # Match your config
      POSTGRES_PASSWORD: phuoc123 # Match your config
      POSTGRES_DB: agentic-rag # Match your config
    ports:
      - "5432:5432" # Standard internal port
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006" # Web UI + HTTP OTLP collector
      - "4317:4317" # gRPC OTLP collector
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - phoenix_data:/mnt/data

  api:
    build: . # build image locally by Dockerfile in current dir (.) 
    ports:
      - "8000:8000" # map host port to container port
    profiles:
      - production
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - PG_HOST=postgres
      - WEAVIATE_HOST=weaviate
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:4317
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4.0'
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - weaviate
      - postgres
      - phoenix

volumes:
  phoenix_data:
    driver: local
