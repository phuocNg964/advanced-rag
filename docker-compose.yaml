---
services:
  weaviate:
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
    image: cr.weaviate.io/semitechnologies/weaviate:1.37.0
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped
    mem_limit: ${WEAVIATE_MEM_LIMIT:-2g}
    memswap_limit: ${WEAVIATE_MEMSWAP_LIMIT:-2g}
    environment:
      CLUSTER_HOSTNAME: "node1"
      CLUSTER_ADVERTISE_ADDR: "127.0.0.1"
      GOMEMLIMIT: ${WEAVIATE_GOMEMLIMIT:-1536MiB}
      ENABLE_API_BASED_MODULES: "true"
      ENABLE_MODULES: ${WEAVIATE_ENABLE_MODULES:-text2vec-transformers}
      DEFAULT_VECTORIZER_MODULE: "text2vec-transformers"
      TRANSFORMERS_INFERENCE_API: "http://text2vec-transformers:8080"
      RERANKER_INFERENCE_API: ${WEAVIATE_RERANKER_INFERENCE_API:-http://reranker-transformers:8080}
      OPENAI_APIKEY: ${OPENAI_API_KEY:-""}
      GOOGLE_APIKEY: ${GEMINI_API_KEY:-""}
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"

  reranker-transformers-cpu:
    image: cr.weaviate.io/semitechnologies/reranker-transformers:cross-encoder-ms-marco-MiniLM-L-6-v2
    profiles: ["legacy-reranker-cpu"]
    restart: unless-stopped
    environment:
      ENABLE_CUDA: "0"
    ports:
      - "127.0.0.1:9091:8080"
    networks:
      default:
        aliases:
          - reranker-transformers

  reranker-transformers-gpu:
    image: cr.weaviate.io/semitechnologies/reranker-transformers:bge-reranker-v2-m3
    profiles: ["gpu"]
    restart: unless-stopped
    environment:
      ENABLE_CUDA: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "127.0.0.1:9091:8080"
    networks:
      default:
        aliases:
          - reranker-transformers

  text2vec-transformers-cpu:
    image: cr.weaviate.io/semitechnologies/transformers-inference:baai-bge-m3-onnx
    restart: unless-stopped
    mem_limit: ${TEXT2VEC_MEM_LIMIT:-4g}
    memswap_limit: ${TEXT2VEC_MEMSWAP_LIMIT:-4g}
    environment:
      ENABLE_CUDA: "0"
    networks:
      default:
        aliases:
          - text2vec-transformers

  text2vec-transformers-gpu:
    image: cr.weaviate.io/semitechnologies/transformers-inference:baai-bge-m3-onnx
    profiles: ["gpu"]
    restart: unless-stopped
    environment:
      ENABLE_CUDA: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      default:
        aliases:
          - text2vec-transformers

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DATABASE:-agentic-rag}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-agentic-rag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - PG_HOST=postgres
      - WEAVIATE_HOST=weaviate
      - PHOENIX_COLLECTOR_ENDPOINT=
      - DOCLING_ARTIFACTS_PATH=/opt/docling/models
      - HF_HUB_OFFLINE=1
      - WARMUP_DOCLING=${WARMUP_DOCLING:-false}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-100}
      - RERANKER_MODE=${RERANKER_MODE:-app}
      - APP_RERANKER_MODEL=${APP_RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      - APP_RERANKER_DEVICE=${APP_RERANKER_DEVICE:-cpu}
      - APP_RERANKER_BATCH_SIZE=${APP_RERANKER_BATCH_SIZE:-8}
      - WARMUP_RERANKER=${WARMUP_RERANKER:-true}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-20}
      - RETRIEVAL_TOP_K_RERANKER=${RETRIEVAL_TOP_K_RERANKER:-5}
      - RETRIEVAL_ALPHA=${RETRIEVAL_ALPHA:-0.5}
      - PG_POOL_MAX_SIZE=${PG_POOL_MAX_SIZE:-5}

    volumes:
      - ./data/raw:/app/data/raw
      - processed_data:/app/data/processed
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_started

volumes:
  weaviate_data:
    driver: local
  postgres_data:
    driver: local
  processed_data:
    driver: local
