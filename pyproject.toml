[project]
name = "multimodal-agentic-knowledge-base"
version = "0.1.0"
description = "Multimodal agentic RAG app — chat with PDFs using LangGraph, Weaviate, and local embeddings"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.121.2",
    "uvicorn==0.38.0",
    "python-multipart==0.0.21",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "langchain-google-genai==4.2.7",
    "langchain-groq==1.1.3",
    "langchain-openai==1.3.5",
    "langchain-ollama==1.1.0",
    "langchain-huggingface==1.2.2",
    "pyyaml==6.0.3",
    "tenacity==9.1.2",
    "langgraph==1.2.9",
    "langgraph-checkpoint-postgres==3.0.5",
    "psycopg[binary,pool]==3.3.2",
    "weaviate-client==4.10.2",
    "sentence-transformers==3.3.1",
    "torch==2.12.1+cpu",
    "torchvision==0.27.1+cpu",
    "docling==2.80.0",
    "pypdf==6.6.0",
    "pillow==12.2.0",
    "pymupdf==1.26.7",
    "easyocr==1.7.2",
    "arize-phoenix-otel==0.15.0",
    "openinference-instrumentation-langchain==0.1.63",
    "opentelemetry-api==1.41.0",
    "opentelemetry-instrumentation-weaviate==0.60.0",
]

[dependency-groups]
dev = [
    "arize-phoenix[evals]",
    "pandas>=2.0.0",
    "langchain-community==0.4.1",
    "ragas==0.4.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
